<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#6d4aff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Ôn từ vựng</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Noto+Sans+SC:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ff;--fg:#1b1740;--mut:#6b6794;--sf:#fff;--ln:#e0dcf7;--ac:#6d4aff;--ac2:#ff5fa2;--ok:#16b97a;--no:#ff6b4a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0d24;--fg:#f1efff;--mut:#9a96c4;--sf:#1a1740;--ln:#2d2965}}
:root[data-theme="dark"]{--bg:#0f0d24;--fg:#f1efff;--mut:#9a96c4;--sf:#1a1740;--ln:#2d2965}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.5 'Be Vietnam Pro',system-ui,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:28px;font-weight:800;margin:8px 0 2px;letter-spacing:-.5px}
.sub{color:var(--mut);margin:0 0 18px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.btn{padding:10px 16px;border-radius:14px;background:var(--sf);border:1px solid var(--ln);font-weight:600}
.btn.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.fold{margin-bottom:18px}
.fh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.fh b{font-size:17px;flex:1}
.list{display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.list .t{flex:1;min-width:0}.list .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .t span{color:var(--mut);font-size:13px}
.empty{padding:36px 16px;text-align:center;color:var(--mut);border:2px dashed var(--ln);border-radius:20px}
.x{color:var(--no);font-size:13px;padding:6px}
.modal{position:fixed;inset:0;background:rgba(10,8,30,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0 0 12px;font-size:20px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--fg);font:inherit}
textarea{min-height:150px;resize:vertical;font-size:14px}
.row{display:flex;gap:8px}.row>*{flex:1}
.hint{font-size:12px;color:var(--mut);margin-top:6px}

/* study */
#study{position:fixed;inset:0;display:none;flex-direction:column;z-index:10;transition:background .6s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
#study.on{display:flex}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px;color:#fff}
.top .pg{flex:1;height:6px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden}
.top .pg i{display:block;height:100%;width:0;background:#fff;border-radius:9px;transition:width .4s}
.top button{color:#fff;background:rgba(255,255,255,.18);border-radius:12px;padding:6px 12px;font-size:13px;font-weight:600}
.stage{flex:1;position:relative;margin:6px 16px;max-width:460px;width:calc(100% - 32px);align-self:center;touch-action:none}
.card{position:absolute;inset:0 0 6px;border-radius:32px;background:var(--sf);color:var(--fg);box-shadow:0 20px 50px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px 22px;overflow:hidden;will-change:transform;user-select:none;-webkit-user-select:none;transition:transform .5s cubic-bezier(.2,.9,.3,1)}
.card.drag{transition:none}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,hsl(var(--h) 90% 60%/.28),transparent 65%);pointer-events:none}
.card>*{position:relative}
.ico{font-size:84px;line-height:1;margin-bottom:10px;animation:fl 3s ease-in-out infinite}
.ico.ph{width:96px;height:96px;border-radius:30px;display:grid;place-items:center;font:900 44px 'Noto Sans SC',sans-serif;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 85% 60%),hsl(calc(var(--h) + 50) 85% 55%))}
@keyframes fl{50%{transform:translateY(-8px) rotate(3deg)}}
.w{font:900 clamp(38px,12vw,60px)/1.1 'Noto Sans SC','Be Vietnam Pro',sans-serif;margin:4px 0;word-break:break-word}
.p{font-size:20px;color:hsl(var(--h) 70% 50%);font-weight:600;margin-bottom:12px}
.m{font-size:20px;font-weight:700;padding:8px 16px;border-radius:14px;background:hsl(var(--h) 90% 60%/.14);filter:blur(9px);transition:filter .3s;cursor:pointer;min-width:120px}
.m.show{filter:none}
.e{margin-top:14px;font-size:15px;color:var(--mut);max-width:90%;font-style:italic}
.say{position:absolute!important;right:14px;top:14px;width:44px;height:44px;border-radius:50%;background:hsl(var(--h) 90% 60%/.18);font-size:20px}
.tag{position:absolute!important;top:22px;padding:6px 14px;border:3px solid;border-radius:12px;font-weight:800;font-size:18px;opacity:0;transform:rotate(-10deg)}
.tag.ok{left:18px;color:var(--ok);border-color:var(--ok)}
.tag.no{right:70px;color:var(--no);border-color:var(--no);transform:rotate(10deg)}
.acts{display:flex;justify-content:center;gap:18px;padding:10px 0 18px}
.acts button{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.95);color:#222;font-size:24px;box-shadow:0 8px 20px rgba(0,0,0,.25);transition:transform .15s}
.acts button:active{transform:scale(.88)}
.done{color:#fff;text-align:center;padding:40px 20px}
.done h2{font-size:30px;margin:10px 0}
.done .big{font-size:80px}
.done .btn{margin:6px}
.top button.on{background:#fff;color:#222}
input[type=range]{padding:0;accent-color:var(--ac)}
.chk{display:flex;align-items:center;gap:10px;margin:0;padding:8px 0;color:var(--fg);font-size:15px}.chk input{width:20px;height:20px}
h1{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:34px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(60% 40% at 85% 0%,rgba(109,74,255,.25),transparent),radial-gradient(50% 40% at 0% 35%,rgba(255,95,162,.18),transparent)}
.bd{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none;font:900 22px 'Noto Sans SC',sans-serif;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 85% 60%),hsl(calc(var(--h) + 50) 85% 55%));box-shadow:0 6px 16px hsl(var(--h) 85% 55%/.35)}
.list{transition:transform .2s}.list:active{transform:scale(.98)}
.tb{position:absolute!important;left:0;bottom:0;height:7px;width:0;background:linear-gradient(90deg,hsl(var(--h) 90% 60%),hsl(calc(var(--h) + 60) 90% 60%))}
@keyframes tb{to{width:100%}}
.orb{position:absolute;border-radius:50%;filter:blur(50px);background:rgba(255,255,255,.2);pointer-events:none;z-index:-1;animation:dr 14s ease-in-out infinite alternate}
.o1{width:300px;height:300px;top:-60px;left:-80px}.o2{width:260px;height:260px;bottom:-40px;right:-70px;animation-delay:-6s}
@keyframes dr{to{transform:translate(60px,80px) scale(1.2)}}
.card .w{font-size:calc(clamp(38px,12vw,60px)*var(--fs,1))}
.card .p{font-size:calc(20px*var(--fs,1))}.card .m{font-size:calc(20px*var(--fs,1))}.card .e{font-size:calc(15px*var(--fs,1))}.card .ico{font-size:calc(84px*var(--fs,1))}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
#wv{position:fixed;inset:0;z-index:8;background:var(--bg);display:none;overflow:auto;padding-top:env(safe-area-inset-top,0px)}
#wv.on{display:block}
.wvh{position:sticky;top:0;z-index:2;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--ln)}
.wvh .r{display:flex;gap:8px;align-items:center;max-width:720px;margin:0 auto 8px}
.wvh h2{margin:0;flex:1;font-size:20px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wb{max-width:720px;margin:0 auto;padding:12px 16px 80px}
.wr{display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:10px 12px;margin-bottom:8px;transition:box-shadow .3s,border-color .3s}
.wr.s{border-color:#ffc83d;box-shadow:0 0 0 1px #ffc83d inset,0 0 22px rgba(255,200,61,.45);animation:gl 2.4s ease-in-out infinite}
@keyframes gl{50%{box-shadow:0 0 0 1px #ffc83d inset,0 0 32px rgba(255,200,61,.85)}}
.wi{font-size:28px;width:40px;text-align:center;flex:none}
.wt{flex:1;min-width:0}.wt b{font:900 20px 'Noto Sans SC','Be Vietnam Pro',sans-serif}.wt small{display:block;color:var(--mut)}.wt .ls{font-size:11px;color:var(--mut);opacity:.8}
.sb{width:44px;height:44px;border-radius:50%;font-size:24px;color:var(--mut);flex:none;transition:transform .25s,color .25s}
.wr.s .sb{color:#ffb400;transform:scale(1.2) rotate(72deg)}
.say.star.on{background:#ffc83d;color:#fff;box-shadow:0 0 18px #ffc83d}
html{-webkit-text-size-adjust:100%}
:root{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
*{scrollbar-width:thin;scrollbar-color:var(--ln) transparent}
body{min-height:100dvh;font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
button,.list{touch-action:manipulation}
input,select,textarea{font-size:16px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.top button:focus-visible,.acts button:focus-visible{outline-color:#fff}
.card{cursor:grab;-webkit-touch-callout:none}.card.drag{cursor:grabbing}
#study,#wv{overscroll-behavior:none;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#wv{padding-bottom:env(safe-area-inset-bottom,0px)}
.top{align-self:center;width:100%;max-width:640px}
.stage{flex:0 1 780px;margin:auto 16px 6px}
.card .w,.bd,.ico.ph,.wt b{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei','Be Vietnam Pro',sans-serif}
#study::after{content:"← Ôn lại   → Đã thuộc   Space: hiện nghĩa   S: đánh sao   A: tự động   Z: quay lại";display:none;color:rgba(255,255,255,.75);font-size:12px;text-align:center;padding:0 16px 14px;margin-bottom:auto}
@media (hover:hover) and (pointer:fine){
 #study::after{display:block}
 .btn,.list{transition:transform .2s,border-color .2s}
 .btn:hover{border-color:var(--ac);transform:translateY(-1px)}
 .list:hover{border-color:var(--ac)}
 .acts button:hover{transform:scale(1.1)}
 .top button:hover{background:rgba(255,255,255,.3)}
 .sb:hover{color:#ffb400}.say:hover{filter:brightness(1.12)}
}
@media (min-width:768px){
 .wrap{max-width:960px;padding-top:36px}
 h1{font-size:44px}
 .fold{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
 .fold .fh,.fold .hint{grid-column:1/-1}.fold .list{margin:0}
 .modal{align-items:center}.sheet{border-radius:24px;max-width:540px}
 .stage{max-width:580px}
 .card{padding:34px 30px}
 .card .w{font-size:calc(76px*var(--fs,1))}.card .p,.card .m{font-size:calc(26px*var(--fs,1))}.card .e{font-size:calc(19px*var(--fs,1))}.card .ico{font-size:calc(110px*var(--fs,1))}
 .wvh .r,.wb{max-width:960px}
 .wb{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wb .wr{margin:0}.wb .empty{grid-column:1/-1}
 .acts button{width:64px;height:64px}
}
@media (max-height:520px) and (orientation:landscape){
 .card{padding:12px 18px}
 .card .ico{font-size:40px;margin-bottom:0}.card .w{font-size:clamp(26px,9vh,44px)}.card .p,.card .m{font-size:16px}.card .m{padding:4px 12px}.card .e{margin-top:6px;font-size:13px}
 .acts{padding:6px 0 8px}.acts button{width:44px;height:44px;font-size:18px}.top{padding:6px 14px}
}
@property --bh{syntax:'<number>';inherits:true;initial-value:250}
#study{background:linear-gradient(160deg,hsl(var(--bh) 70% 45%),hsl(calc(var(--bh) + 60) 70% 30%));transition:--bh .9s ease}
.orb{background:hsl(var(--bh) 95% 72%/.35)}
#study.on,#wv.on{animation:so .45s cubic-bezier(.2,.9,.3,1)}
@keyframes so{from{opacity:0;transform:scale(1.05)}}
.btn:active{transform:scale(.96)}
.pg i{box-shadow:0 0 12px #fff}
.card::after{content:"";position:absolute;inset:-20%;pointer-events:none;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%);transform:translateX(calc(var(--px,0)*1.2px));opacity:calc(var(--a,0)*.9)}
.card .ico{translate:calc(var(--px,0)*.14px) calc(var(--py,0)*.05px)}
.card .w{translate:calc(var(--px,0)*.08px) 0}
.card .p,.card .e,.card .m{translate:calc(var(--px,0)*.04px) 0}
.card .ico,.card .w,.card .p,.card .e{transition:translate .45s cubic-bezier(.2,.9,.3,1)}
.card .m{transition:filter .3s,translate .45s cubic-bezier(.2,.9,.3,1)}
.card.drag .ico,.card.drag .w,.card.drag .p,.card.drag .e,.card.drag .m{transition:none}
.card.in{animation:cin .5s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes cin{from{opacity:0;transform:translateY(50px) scale(.8)}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#262040;color:#fff;padding:10px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.3s;z-index:40;font-size:14px;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.wt .ls{display:block}.sb.ed{font-size:18px;width:38px}
#study{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.card .w.hz{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:6px 0}
.hzb{width:min(calc(var(--hs)*var(--fs,1)*1px),calc((100vw - 96px)/var(--n)));aspect-ratio:1;border-radius:12px;border:1.5px dashed hsl(var(--h) 70% 65%/.55);background:hsl(var(--h) 90% 60%/.07);display:grid;place-items:center;font:900 40px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.hzb svg{width:100%;height:100%;display:block}
.hzo{fill:hsl(var(--h) 40% 50%/.18)}
.hzs{fill:none;stroke:var(--fg);stroke-width:190;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.hzg{stroke:hsl(var(--h) 60% 60%/.4);stroke-width:6;stroke-dasharray:24 18;fill:none}
.card:has(.hz) .ico{font-size:calc(52px*var(--fs,1))}
.acts button.on{background:#ffc83d;box-shadow:0 0 20px #ffc83d}
@media (max-width:420px){.acts{gap:10px}.acts button{width:52px;height:52px}}
@media (prefers-reduced-motion:reduce){.card.in{animation:none}.card::after{display:none}#study.on,#wv.on{animation:none}}
@media (prefers-reduced-motion:reduce){.wr.s{animation:none}.orb{animation:none}.ico{animation:none}.card{transition-duration:.01s}}
</style>
</head>
<body>
<div class="wrap" id="home">
  <h1>Ôn từ vựng</h1>
  <p class="sub">Nhập từ Trung hoặc Anh, gom thành thư mục, vuốt thẻ để ôn.</p>
  <div class="bar">
    <button class="btn pri" onclick="openList()">+ Danh sách từ</button>
    <button class="btn" onclick="newFolder()">+ Thư mục</button>
    <button class="btn" onclick="openWords('all')">Tất cả từ</button>
    <button class="btn pri" id="dueBtn" onclick="studyDue('all')">📅 Ôn hôm nay</button>
    <button class="btn" id="starBtn" onclick="studyStar('all')">⭐ Ôn từ khó</button>
    <button class="btn" id="syncBtn" onclick="openBackup()">☁ Sao lưu</button>
    <button class="btn" onclick="demo()">Nạp dữ liệu mẫu</button>
  </div>
  <div id="lib"></div>
</div>

<div id="wv"><div class="wvh"><div class="r"><button class="btn sm" onclick="closeWords()" aria-label="Quay lại">←</button><h2 id="wvt"></h2><button class="btn sm pri" id="wvs" onclick="studyStar(wvScope)"></button></div><div class="r"><select id="wvsel" onchange="wvScope=this.value;drawWords()" style="flex:1;min-width:0"></select><button class="btn sm pri" onclick="studyScope(wvScope)" style="white-space:nowrap">▶ Ôn phạm vi này</button></div><div class="r" style="flex-wrap:wrap"><button class="btn sm" onclick="openWord(curList(),null)">+ Thêm từ</button><button class="btn sm" id="wvd" onclick="studyDue(wvScope)"></button><button class="btn sm" id="wve" onclick="editList(wvScope)" style="display:none">✎ Sửa danh sách</button></div><div class="r"><input id="wvq" placeholder="Tìm từ, phiên âm, nghĩa" oninput="wvQ=this.value;drawWords()"><button class="btn sm" id="wvf" onclick="wvOnly=!wvOnly;drawWords()" style="white-space:nowrap"></button></div></div><div class="wb" id="wvb"></div></div>
<div id="toast"></div>
<canvas id="cf"></canvas>
<div class="modal" id="mdl" onclick="if(event.target===this)closeM()"><div class="sheet" id="sheet"></div></div>

<div id="study"><i class="orb o1"></i><i class="orb o2"></i>
  <div class="top"><button onclick="quit()" aria-label="Đóng">✕</button><div class="pg"><i id="pgi"></i></div><span id="cnt" style="font-size:13px;font-weight:600"></span><button onclick="shuf()" aria-label="Trộn">🔀</button><button id="autoBtn" onclick="toggleAuto()">▶ Tự động</button><button id="gestBtn" onclick="toggleGest()" aria-label="Điều khiển bằng cử chỉ tay" title="Điều khiển bằng cử chỉ tay">✋</button><button onclick="openCfg()" aria-label="Cài đặt">⚙</button></div>
  <div class="stage" id="stage"></div>
  <div class="acts" id="acts">
    <button onclick="undo()" aria-label="Quay lại">↩</button>
    <button onclick="fly(-1)" aria-label="Ôn lại" style="color:var(--no)">✕</button>
    <button onclick="fly(1)" aria-label="Đã thuộc" style="color:var(--ok)">✓</button>
    <button id="hideBtn" onclick="toggleHide()" aria-label="Ẩn hay hiện nghĩa">🙈</button>
    <button id="strokeBtn" onclick="toggleStroke()" aria-label="Chạy nét chữ">✍</button>
  </div>
</div>

<script>
var S={folders:[],lists:[]},$=function(i){return document.getElementById(i)};
function load(){try{var d=localStorage.getItem('vocab-v1');if(d)S=JSON.parse(d)}catch(e){}}
function save(nopush){try{localStorage.setItem('vocab-v1',JSON.stringify(S))}catch(e){}if(!nopush)schedSync()}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ---------- library ---------- */
function listRow(l){var ic=(l.words.filter(function(w){return w.i})[0]||{}).i||((l.words[0]||{w:'+'}).w).charAt(0);return '<div class="list"><div class="bd" style="--h:'+hue(l.name)+'">'+esc(ic)+'</div><div class="t"><b>'+esc(l.name)+'</b><span>'+l.words.length+' từ · '+(l.lang==='zh'?'Tiếng Trung':'Tiếng Anh')+'</span></div><button class="btn sm pri" onclick="study(\'list\',\''+l.id+'\')">Ôn</button><button class="btn sm" onclick="openWords(\''+l.id+'\')">Xem</button><button class="x" onclick="del(this,\'list\',\''+l.id+'\')">Xóa</button></div>'}
function render(){
  var ns=0;S.lists.forEach(function(l){l.words.forEach(function(w){if(w.s)ns++})});
  if($('starBtn')){$('starBtn').textContent='⭐ Ôn từ khó ('+ns+')';$('starBtn').style.opacity=ns?1:.5}
  if($('dueBtn')){var nd=dueCount('all');$('dueBtn').textContent='📅 Ôn hôm nay ('+nd+')';$('dueBtn').style.opacity=nd?1:.5}
  var h='';
  S.folders.forEach(function(f){

function csvSplit(s){var o=[],c='',q=false;for(var i=0;i<s.length;i++){var ch=s.charAt(i);if(q){if(ch==='"'){if(s.charAt(i+1)==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){o.push(c);c=''}else c+=ch}o.push(c);return o}
function parse(t){
  var out=[];
  t.split(/\r?\n/).forEach(function(line){
    line=line.trim();if(!line)return;
    var c=line.charAt(0)==='"'?csvSplit(line):line.indexOf('|')>-1?line.split('|'):line.indexOf('\t')>-1?line.split('\t'):line.split(/[,，;]/);
    c=c.map(function(x){return x.trim().replace(/^"|"$/g,'')});
    if(!c[0]||/^(word|từ|từ vựng)$/i.test(c[0]))return;
    out.push({w:c[0],p:c[1]||'',m:c[2]||'',i:c[3]||'',e:c.slice(4).join(', ')});
  });
  return out;
}

var deck=[],idx=0,hist=[],lang='en',known=0,again=[],drag=null,busy=false;
function study(type,id){
  var ls=type==='list'?S.lists.filter(function(l){return l.id===id}):S.lists.filter(function(l){return l.folder===id});
  deck=[];ls.forEach(function(l){l.words.forEach(function(w){deck.push({w:w.w,p:w.p,m:w.m,i:w.i,e:w.e,l:l.lang,r:w})})});
  if(!deck.length)return;
  shuffle(deck);start();
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}}
function shuf(){shuffle(deck);start()}
function start(){idx=0;hist=[];hsn=[];known=0;again=[];$('study').classList.add('on');$('home').style.display='none';document.body.style.overflow='hidden';lock();updHide();stack()}
function quit(){auto=false;autoTok++;updAuto();unlock();$('study').classList.remove('on');$('home').style.display='';document.body.style.overflow='';speechSynthesis&&speechSynthesis.cancel()}
function hue(w){var h=0;for(var i=0;i<w.length;i++)h=(h*31+w.charCodeAt(i))%360;return h}
function cardHTML(d,k){
  var h=hue(d.w),ic=d.i?'<div class="ico">'+esc(d.i)+'</div>':'<div class="ico ph">'+esc(d.w.charAt(0).toUpperCase())+'</div>';
  return '<div class="card" data-k="'+k+'" style="--h:'+h+'"><span class="tag ok">ĐÃ THUỘC</span><span class="tag no">ÔN LẠI</span>'+
  '<i class="tb"></i><button class="say" onclick="speak(event)" aria-label="Đọc to">🔊</button><button class="say star'+(d.r&&d.r.s?' on':'')+'" style="top:66px" onclick="starCur(event,this)" aria-label="Đánh dấu từ khó">'+(d.r&&d.r.s?'★':'☆')+'</button>'+ic+wordHTML(d)+(d.p?'<div class="p">'+esc(d.p)+'</div>':'')+
  (d.m?'<div class="m'+(cfg.hide?'':' show')+'">'+esc(d.m)+'</div>':'')+(d.e?'<div class="e">'+esc(d.e)+'</div>':'')+'</div>';
}
function rev(el){el.classList.toggle('show')}
function place(){
  var cs=[].slice.call($('stage').children);
  cs.forEach(function(c){var k=+c.dataset.k;if(k===0)return;c.style.transform='translateY('+(k*14)+'px) scale('+(1-k*.05)+')';c.style.opacity=1-k*.25});
}
function stack(){
  if(idx>=deck.length){return finish()}
  var h='';for(var k=Math.min(2,deck.length-idx-1);k>=0;k--)h+=cardHTML(deck[idx+k],k);
  $('stage').innerHTML=h;place();
  $('acts').style.display='flex';

  var top=$('stage').lastElementChild;top.classList.add('top');
  var t=$('stage').querySelector('[data-k="0"]');bind(t);playStrokes(t);
}
function bindOld(t){
  t.addEventListener('pointerdown',function(e){
    if(busy||e.target.closest('button'))return;
    drag={x:e.clientX,y:e.clientY,dx:0,dy:0,t:Date.now(),moved:false};t.setPointerCapture(e.pointerId);t.classList.add('drag');
  });
  t.addEventListener('pointermove',function(e){
    if(!drag)return;drag.dx=e.clientX-drag.x;drag.dy=e.clientY-drag.y;
    if(Math.abs(drag.dx)+Math.abs(drag.dy)>6)drag.moved=true;
    t.style.transform='perspective(900px) translate('+drag.dx+'px,'+drag.dy+'px) rotate('+(drag.dx/18)+'deg) rotateX('+(-drag.dy/28)+'deg) rotateY('+(drag.dx/14)+'deg)';
    t.style.setProperty('--px',drag.dx);t.style.setProperty('--py',drag.dy);
    var g=Math.min(1,Math.abs(drag.dx)/130);t.style.setProperty('--a',g);
    t.style.boxShadow='0 20px 50px rgba(0,0,0,.3),0 0 '+(70*g)+'px '+(8*g)+'px '+(drag.dx>0?'rgba(22,185,122,':'rgba(255,107,74,')+(.7*g)+')';
    var p=Math.min(1,Math.abs(drag.dx)/120);
    t.querySelector('.tag.ok').style.opacity=drag.dx>0?p:0;t.querySelector('.tag.no').style.opacity=drag.dx<0?p:0;
    var n=$('stage').querySelector('[data-k="1"]');if(n){n.style.transition='none';n.style.transform='translateY('+(14-14*p)+'px) scale('+(.95+.05*p)+')';n.style.opacity=.75+.25*p}
    var n2=$('stage').querySelector('[data-k="2"]');if(n2){n2.style.transition='none'}
  });
  function end(){
    if(!drag)return;var d=drag;drag=null;t.classList.remove('drag');
    var n=$('stage').querySelector('[data-k="1"]');if(n)n.style.transition='';
    var v=Math.abs(d.dx)/Math.max(1,Date.now()-d.t);
    if(Math.abs(d.dx)>110||(v>.5&&Math.abs(d.dx)>40)){fly(d.dx>0?1:-1,d)}
    else{t.style.transform='';t.style.boxShadow='';t.style.setProperty('--px',0);t.style.setProperty('--py',0);t.style.setProperty('--a',0);t.querySelectorAll('.tag').forEach(function(x){x.style.opacity=0})}
  }
  t.addEventListener('pointerup',end);t.addEventListener('pointercancel',end);
}
function fly(dir,d,neu){
  if(busy||idx>=deck.length)return;busy=true;
  var t=$('stage').querySelector('[data-k="0"]');if(!t){busy=false;return}
  var dx=d?d.dx:0,dy=d?d.dy:0;
  if(!neu){t.querySelector(dir>0?'.tag.ok':'.tag.no').style.opacity=1;t.style.boxShadow='0 20px 50px rgba(0,0,0,.3),0 0 80px 14px '+(dir>0?'rgba(22,185,122,.75)':'rgba(255,107,74,.75)')}
  t.style.transition='transform .45s cubic-bezier(.4,.1,.6,1),opacity .45s';
  t.style.transform='perspective(900px) translate('+(dir*window.innerWidth*1.1)+'px,'+(dy*1.5)+'px) rotate('+(dir*28)+'deg) rotateX(0deg) rotateY('+(dir*30)+'deg)';t.style.opacity=0;
  var n=$('stage').querySelector('[data-k="1"]');if(n){n.style.transition='transform .45s cubic-bezier(.2,.9,.3,1),opacity .45s';n.style.transform='';n.style.opacity=1}
  if(!neu&&navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
  if(neu){hist.push(2);hsn.push(null)}else{var rw=deck[idx].r;hsn.push(rw?{b:rw.b,d:rw.d}:null);if(rw)grade(rw,dir>0);if(dir>0)known++;else again.push(deck[idx]);hist.push(dir)}
  setTimeout(function(){idx++;busy=false;advance();if(auto&&!neu)loop()},330);
}
function advance(){
  var st=$('stage'),old=st.querySelector('[data-k="0"]');
  if(!old||idx>=deck.length){stack();return}
  old.remove();
  [].forEach.call(st.querySelectorAll('.card'),function(c){c.dataset.k=(+c.dataset.k)-1});
  if(deck[idx+2])st.insertAdjacentHTML('afterbegin',cardHTML(deck[idx+2],2));
  var nw=st.querySelector('[data-k="2"]');if(nw)nw.classList.add('in');
  place();
  [].forEach.call(st.querySelectorAll('.card'),function(c){c.style.transition=''});
  var t=st.querySelector('[data-k="0"]');t.style.transform='';t.style.opacity=1;bind(t);playStrokes(t);
  var d=deck[idx];$('study').style.setProperty('--bh',hue(d.w));
  $('pgi').style.width=(idx/deck.length*100)+'%';$('cnt').textContent=(idx+1)+'/'+deck.length;
}
function undo(){
  if(busy||idx===0)return;idx--;var dir=hist.pop();var sn=hsn.pop();if(sn&&deck[idx]&&deck[idx].r){deck[idx].r.b=sn.b;deck[idx].r.d=sn.d;touchW(deck[idx].r);save()}
  if(dir===1)known--;else if(dir===-1)again.pop();stack();if(auto)loop();
  var t=$('stage').querySelector('[data-k="0"]');t.style.transition='none';t.style.transform='translateX('+(-dir*300)+'px) rotate('+(-dir*20)+'deg)';t.style.opacity=0;
  requestAnimationFrame(function(){requestAnimationFrame(function(){t.style.transition='transform .5s cubic-bezier(.2,.9,.3,1),opacity .3s';t.style.transform='';t.style.opacity=1})});
}
function finish(){

  $('stage').innerHTML='<div class="done"><div class="big">'+(known===deck.length?'🏆':'🎉')+'</div><h2>Xong rồi!</h2><p>Đã thuộc '+known+'/'+deck.length+' từ.</p>'+
  (again.length?'<button class="btn pri" onclick="redo()">Ôn lại '+again.length+' từ chưa thuộc</button>':'')+'<button class="btn" onclick="shuf()">Ôn lại từ đầu</button><button class="btn" onclick="quit()">Về thư viện</button></div>';

async function loop(){
  var tok=++autoTok;

  await sleep(350);
  while(auto&&tok===autoTok){
    if(idx>=deck.length){if(cfg.lp){shuffle(deck);start()}else{auto=false;updAuto();return}await sleep(500);if(tok!==autoTok)return}
    var d=deck[idx];
    var tb=document.querySelector('[data-k="0"] .tb');if(tb){tb.style.animation='none';void tb.offsetWidth;tb.style.animation='tb '+cfg.sec+'s linear forwards'}
    say(d.w,d.l==='zh'?'zh-CN':'en-US');

  }

"zhànlìpǐn","Chiến lợi phẩm","这是我赢来的战利品。 (Đây là chiến lợi phẩm tôi giành được.)","🏆"],["免得","miǎnde","Tránh việc, kẻo","早点出发，免得迟到。 (Đi sớm một chút, kẻo muộn.)","🛑"],["说闲话","shuō xiánhuà","Nói chuyện phiếm, nói ra nói vào","别在背后说人闲话。 (Đừng có nói chuyện phiếm/nói xấu sau lưng người khác.)","🗣️"],["农场","nóngchǎng","Nông trường","他们周末去农场摘草莓. (Cuối tuần họ đến nông trường hái dâu tây.)","🚜"],["豆芽菜","dòuyácài","Rau mầm, giá đỗ","她长得像个豆芽菜。 (Cô ấy gầy nhom trông như cọng giá đỗ vậy.)","🌱"],["偷","tōu","Trộm, ăn cắp","他偷了一个苹果。 (Cậu ấy ăn cắp một quả táo.)","🥷"],["拉黑","lāhēi","Chặn (trên mạng xã hội)","他把我拉黑了。 (Anh ấy chặn tôi rồi.)","🚫"],["有屁快放","yǒu pì kuài fàng","Có gì nói mau","有屁快放，我很忙。 (Có gì nói mau đi, tôi đang bận lắm.)","💨"],["呗","bei","Nha, thế thôi, thì...","你不去，我就自己去呗。 (Cậu không đi thì tôi tự đi vậy thôi.)","呢"],["理","lǐ","Để ý, quan tâm, đoái hoài","他生气了，谁理你. (Cậu ấy giận rồi, ai thèm để ý đến cậu.)","💭"],["亏心","kuīxīn","Thẹn lòng, cắn rứt lương tâm","做事要对得起良心，别太亏心。 (Làm việc phải có lương tâm, đừng để thẹn lòng.)","🖤"],["亏心事","kuīxīnshì","Việc làm trái lương tâm, việc xấu","他从来不做亏心事。 (Anh ấy chưa từng làm việc gì trái lương tâm.)","🥀"],["整","zhěng","Xử lý, chơi khăm, làm","这件事怎么整？ (Việc này giải quyết thế nào đây?)","🔧"],["停","tíng","Dừng, ngừng","雨停了。 (Mưa tẻ rồi / Mưa ngừng rồi.)","⏹️"],["嘴硬","zuǐyìng","Cứng miệng, già mồm","你就别嘴硬了。 (Cậu đừng có mà cứng miệng nữa.)","🧱"],["淋雨","línyǔ","Dầm mưa, tắm mưa","别在外面淋雨。 (Đừng có dầm mưa ngoài kia.)","🌧️"],["勉为其难","miǎnwéiqínán","Miễn cưỡng, ráng sức làm việc khó","既然你这么说，我就勉为其难地试一试。 (Đã vậy thì tôi miễn cưỡng thử một lần xem sao.)","🤷"],["到底","dàodǐ","Rốt cuộc, đến cùng, rốt cục","你到底想什么？ (Rốt cuộc cậu đang nghĩ gì vậy?)","🎯"],["学人说话","xué rén shuōhuà","Học theo/bắt chước người ta nói chuyện","别学人说话，真幼稚。 (Đừng có bắt chước người ta nói chuyện, trẻ con lắm.)","🦜"],["秘密","mìmì","Bí mật","这是我们的秘密。 (Đây là bí mật của chúng ta.)","🤫"],["撞见","zhuàngjiàn","Tình cờ gặp, bắt gặp","我在街上撞见他了。 (Tôi vô tình bắt gặp anh ấy trên function loadPreset(){
  S.dels=S.dels||{};var add=0;
  PRESET.forEach(function(g){
    if(!S.dels[g.id]&&!S.folders.some(function(f){return f.id===g.id}))S.folders.push({id:g.id,name:g.name,u:1});
    g.l.forEach(function(p){
      if(S.dels[p.id]||S.lists.some(function(l){return l.id===p.id}))return;
      S.lists.push({id:p.id,name:p.name,lang:'zh',folder:S.dels[g.id]?'':g.id,u:1,words:p.w.map(function(x){return{w:x[0],p:x[1],m:x[2],i:x[4]||'',e:x[3]}})});add++;
    });
  });
  if(add){save(true);setTimeout(function(){toast('\u0110\u00e3 th\u00eam s\u1eb5n '+add+' danh s\u00e1ch t\u1eeb v\u1ef1ng')},600)}
}

    /* vận tốc theo khung */
    var minPix=Math.max(3,6/s),vok=false,pt=null,usedP=false;
    if(nPos>=minPix&&nNeg>=minPix&&nPos<=900&&nNeg<=900&&nPos/nNeg<5&&nNeg/nPos<5&&(nPos+nNeg)/N<0.2){
      var vx=-((sxPos/nPos)-(sxNeg/nNeg))/W, vy=((syPos/nPos)-(syNeg/nNeg))/H;
      vt.push({t:now,vx:vx,vy:vy,dt:fdt});vok=true;
      pt={x:sxPos/nPos,y:syPos/nPos};usedP=true;
    }
    var rP=cP/N,rA=cA/N;
    if(rA<0.025){if(!quietSince)quietSince=now;if(now-quietSince>(cfg.gh===true?700:450))armed=true}else quietSince=0;
    if(rA>0.25){armed=false;quietSince=0}
    if(!vok){
      if(rP>=0.0005/s&&rP<=0.15&&rA<0.45){pt={x:sxP/cP,y:syP/cP};usedP=true;var nxP=1-pt.x/W;if(trP.length&&Math.abs(nxP-trP[trP.length-1].x)>0.12)trP=[];trP.push({t:now,x:nxP,y:pt.y/H})}
      else if(trP.length&&now-trP[trP.length-1].t>200)trP=[];
      if(!usedP&&rA>=Math.max(0.006,0.0015/s)&&rA<=0.40){pt={x:sxA/cA,y:syA/cA};var nxA=1-pt.x/W;if(trA.length&&Math.abs(nxA-trA[trA.length-1].x)>0.12)trA=[];trA.push({t:now,x:nxA,y:pt.y/H,r:rA})}
      else if(rA>0.40||(trA.length&&now-trA[trA.length-1].t>200))trA=[];
    }else{trP=[];trA=[]}

    var hOn=cfg.gh===true,fl=null;
    if(vok){vtH=[]}
    else if(hOn&&rA>=0.003/s&&rA<=0.55){
      fl=flowDx(g,p3,mv,colC,rowC);
      if(fl&&Math.abs(fl.dx)>=2&&Math.abs(fl.dx)<=8)vtH.push({t:now,vx:-(fl.dx/W)/3,vy:0,dt:fdt});
    }
    if(pt){ox.beginPath();ox.arc(pt.x,pt.y,6,0,6.283);ox.lineWidth=2;ox.strokeStyle=usedP?'#ff3b6b':'#fff';ox.stroke()}
    lbl.textContent=vok?'● bút':(fl?'◐ đầu/tay':(usedP?'◐ bút mờ':(pt?'○ chuyển động':'· chờ')));

    if(pt){var cxm=1-pt.x/W;if(lastPx===null||Math.abs(cxm-lastPx)>0.015)lastMoveT=now;lastPx=cxm}else lastPx=null;
    if(blockOpp&&(now-lastMoveT>260||now-lastT>900))blockOpp=false;
    if(!armed){lbl.textContent='⏳ giữ yên';return}
    if(now<cool)return;

    var kk=Math.sqrt(1.4/s),r=evalVel(now,s);
    if(!r&&!vok)r=usedP?evalTrack(trP,0.09*kk,0.18*kk,0.5*kk,now,0,false):evalTrack(trA,0.11*kk,0.20*kk,0.40*kk,now,0.028*kk,false);
    if(!r&&hOn){r=evalFlow(now,s);if(r)r.src='flow'}
    if(!r)return;
    trP=[];trA=[];vt=[];vtH=[];
    if(r.up){cool=now+600;flash('rv');var mm=document.querySelector('[data-k="0"] .m');if(mm)rev(mm);return}
    /* nét kéo tay về thường chậm hơn cú hất: chỉ nhận ngược chiều khi tay đã nghỉ hoặc cú mới nhanh hơn rõ rệt */
    if(blockOpp&&r.dir!==lastDir&&r.spd<lastSpd*0.9)return;
    lastDir=r.dir;lastT=now;lastSpd=r.spd;cool=now+(r.src==='flow'?700:350);blockOpp=true;lastMoveT=now;if(r.src==='flow'){armed=false;quietSince=0}
    flash(r.dir>0?'ok':'no');
    if(typeof toast==='function')toast(r.dir>0?'✏️ → Đã thuộc':'✏️ ← Ôn lại');
    fly(r.dir);
  }

  window.gestOn=async function(silent){
    if(stream)return true;
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      if(!silent)toast('Trình duyệt này không hỗ trợ camera (cần mở bằng https hoặc localhost).');return false}
    try{
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:320},height:{ideal:240},frameRate:{ideal:30}},audio:false});
    }catch(e){
      stream=null;cfg.gest=false;
      if(!silent){var n=(e&&e.name)||'',msg;
        if(!window.isSecureContext)msg='Camera chỉ chạy khi trang mở bằng https hoặc localhost (hiện đang không an toàn).';
        else if(n==='NotFoundError'||n==='OverconstrainedError')msg='Không tìm thấy camera trước trên thiết bị này.';
        else if(n==='NotReadableError'||n==='AbortError')msg='Camera đang được app khác dùng (Zoom, Camera...). Hãy tắt app đó rồi thử lại.';
        else if(window.self!==window.top)msg='Trang đang mở trong khung nhúng nên bị chặn camera. Hãy mở file trực tiếp trong Chrome/Safari.';
        else msg='Quyền camera đang bị chặn: bấm biểu tượng ổ khóa cạnh thanh địa chỉ → Camera → Cho phép, rồi tải lại trang.';
        toast(msg+' ['+n+']')}
      var b=document.getElementById('gestBtn');if(b)b.classList.remove('on');return false}
    vid.srcObject=stream;try{await vid.play()}catch(e){}
    armed=false;quietSince=0;hist=[];trP=[];trA=[];vt=[];vtH=[];lastDir=0;lastSpd=0;lastFT=0;blockOpp=false;base=null;covered=false;cool=Date.now()+1500;
    mlH=[];handSince=0;absentSince=0;stillSince=0;revLock=false;if(cfg.ml!==false)lmLoad();
    box.classList.add('on');document.getElementById('gestBtn').classList.add('on');
    schedule();
    return true;
  };
  window.gestOff=function(){
    if(timer){clearTimeout(timer);timer=null}
    if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
    vid.srcObject=null;box.classList.remove('on');
    var b=document.getElementById('gestBtn');if(b)b.classList.remove('on');
  };
  window.toggleGest=async function(){
    if(stream){cfg.gest=false;gestOff();toast('Đã tắt điều khiển bằng tay')}
    else{
      var ok=await gestOn();cfg.gest=ok;
      if(ok&&cfg.ml!==false&&!lmFail)toast('Vẩy bàn tay sang phải = Đã thuộc · trái = Ôn lại · vẩy lên hoặc giữ bàn tay mở yên = hiện nghĩa');
      else if(ok)toast('Vẩy bút sang phải = Đã thuộc · trái = Ôn lại · vẩy lên hoặc che camera = hiện nghĩa');
    }
    try{localStorage.setItem('vocab-cfg',JSON.stringify(cfg))}catch(e){}
  };
  var _start=window.start,_quit=window.quit;
  window.start=function(){_start.apply(this,arguments);if(cfg.gest)gestOn(true)};
  window.quit=function(){gestOff();_quit.apply(this,arguments)};
  document.addEventListener('visibilitychange',function(){if(document.hidden&&stream){gestOff()}else if(!document.hidden&&cfg.gest&&document.getElementById('study').classList.contains('on')&&!stream){gestOn(true)}});
})();

applyFs();load();loadPreset();render();initSync();updStroke();if(cfg.stroke)hzLoad().then(function(){if($('study').classList.contains('on'))stack()});
</script>
