<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#6d4aff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Ôn từ vựng</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Noto+Sans+SC:wght@500;900&family=Noto+Serif+SC:wght@600;900&family=Fredoka:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ff;--fg:#1b1740;--mut:#6b6794;--sf:#fff;--ln:#e0dcf7;--ac:#6d4aff;--ac2:#ff5fa2;--ok:#16b97a;--no:#ff6b4a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0d24;--fg:#f1efff;--mut:#9a96c4;--sf:#1a1740;--ln:#2d2965}}
:root[data-theme="dark"]{--bg:#0f0d24;--fg:#f1efff;--mut:#9a96c4;--sf:#1a1740;--ln:#2d2965}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.5 'Be Vietnam Pro',system-ui,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:28px;font-weight:800;margin:8px 0 2px;letter-spacing:-.5px}
.sub{color:var(--mut);margin:0 0 18px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.btn{padding:10px 16px;border-radius:14px;background:var(--sf);border:1px solid var(--ln);font-weight:600}
.btn.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.fold{margin-bottom:18px}
.fh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.fh b{font-size:17px;flex:1}
.list{display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.list .t{flex:1;min-width:0}.list .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .t span{color:var(--mut);font-size:13px}
.empty{padding:36px 16px;text-align:center;color:var(--mut);border:2px dashed var(--ln);border-radius:20px}
.x{color:var(--no);font-size:13px;padding:6px}
.modal{position:fixed;inset:0;background:rgba(10,8,30,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0 0 12px;font-size:20px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--fg);font:inherit}
textarea{min-height:150px;resize:vertical;font-size:14px}
.row{display:flex;gap:8px}.row>*{flex:1}
.hint{font-size:12px;color:var(--mut);margin-top:6px}

/* study */
#study{position:fixed;inset:0;display:none;flex-direction:column;z-index:10;transition:background .6s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
#study.on{display:flex}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px;color:#fff}
.top .pg{flex:1;height:6px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden}
.top .pg i{display:block;height:100%;width:0;background:#fff;border-radius:9px;transition:width .4s}
.top button{color:#fff;background:rgba(255,255,255,.18);border-radius:12px;padding:6px 12px;font-size:13px;font-weight:600}
.stage{flex:1;position:relative;margin:6px 16px;max-width:460px;width:calc(100% - 32px);align-self:center;touch-action:none}
.card{position:absolute;inset:0 0 6px;border-radius:32px;background:var(--sf);color:var(--fg);box-shadow:0 20px 50px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px 22px;overflow:hidden;will-change:transform;user-select:none;-webkit-user-select:none;transition:transform .5s cubic-bezier(.2,.9,.3,1)}
.card.drag{transition:none}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,hsl(var(--h) 90% 60%/.28),transparent 65%);pointer-events:none}
.card>*{position:relative}
.ico{font-size:84px;line-height:1;margin-bottom:10px;animation:fl 3s ease-in-out infinite}
.ico.ph{width:96px;height:96px;border-radius:30px;display:grid;place-items:center;font:900 44px 'Noto Sans SC',sans-serif;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 85% 60%),hsl(calc(var(--h) + 50) 85% 55%))}
@keyframes fl{50%{transform:translateY(-8px) rotate(3deg)}}
.card .ico.ph{font-size:calc(44px*var(--fs,1))}
.w{font:900 clamp(38px,12vw,60px)/1.1 'Noto Sans SC','Be Vietnam Pro',sans-serif;margin:4px 0;word-break:break-word}
.p{font-size:20px;color:hsl(var(--h) 70% 50%);font-weight:600;margin-bottom:12px}
.m{font-size:20px;font-weight:700;padding:8px 16px;border-radius:14px;background:hsl(var(--h) 90% 60%/.14);filter:blur(9px);transition:filter .3s;cursor:pointer;min-width:120px}
.m.show{filter:none}
.e{margin-top:14px;font-size:15px;color:var(--mut);max-width:90%;font-style:italic}
.say{position:absolute!important;right:14px;top:14px;width:44px;height:44px;border-radius:50%;background:hsl(var(--h) 90% 60%/.18);font-size:20px}
.tag{position:absolute!important;top:22px;padding:6px 14px;border:3px solid;border-radius:12px;font-weight:800;font-size:18px;opacity:0;transform:rotate(-10deg)}
.tag.ok{right:70px;color:var(--ok);border-color:var(--ok);transform:rotate(10deg)}
.tag.no{left:18px;color:var(--no);border-color:var(--no)}
.acts{display:flex;justify-content:center;gap:18px;padding:10px 0 18px}
.acts button{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.95);color:#222;font-size:24px;box-shadow:0 8px 20px rgba(0,0,0,.25);transition:transform .15s}
.acts button{position:relative;overflow:hidden}
.acts button:active{transform:scale(.92)}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:rp .55s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(2.6);opacity:0}}
@keyframes shk{0%,100%{translate:0}15%{translate:-14px}35%{translate:12px}55%{translate:-8px}75%{translate:5px}}
@keyframes bnc{0%{scale:1}35%{scale:1.06}65%{scale:.985}100%{scale:1}}
.card.shk{animation:shk .42s ease-out}
.card.bnc{animation:bnc .42s cubic-bezier(.2,.9,.3,1)}
.done{color:#fff;text-align:center;padding:40px 20px}
.done h2{font-size:30px;margin:10px 0}
.done .big{font-size:80px}
.done .btn{margin:6px}
.top button.on{background:#fff;color:#222}
input[type=range]{padding:0;accent-color:var(--ac)}
.chk{display:flex;align-items:center;gap:10px;margin:0;padding:8px 0;color:var(--fg);font-size:15px}.chk input{width:20px;height:20px}
h1{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:34px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(60% 40% at 85% 0%,rgba(109,74,255,.25),transparent),radial-gradient(50% 40% at 0% 35%,rgba(255,95,162,.18),transparent)}
.bd{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none;font:900 22px 'Noto Sans SC',sans-serif;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 85% 60%),hsl(calc(var(--h) + 50) 85% 55%));box-shadow:0 6px 16px hsl(var(--h) 85% 55%/.35)}
.list{transition:transform .2s}.list:active{transform:scale(.98)}
.tb{position:absolute!important;left:0;bottom:0;height:7px;width:0;background:linear-gradient(90deg,hsl(var(--h) 90% 60%),hsl(calc(var(--h) + 60) 90% 60%))}
@keyframes tb{to{width:100%}}
.orb{position:absolute;border-radius:50%;filter:blur(50px);background:rgba(255,255,255,.2);pointer-events:none;z-index:-1;animation:dr 14s ease-in-out infinite alternate}
.o1{width:300px;height:300px;top:-60px;left:-80px}.o2{width:260px;height:260px;bottom:-40px;right:-70px;animation-delay:-6s}
@keyframes dr{to{transform:translate(60px,80px) scale(1.2)}}
.card .w{font-size:calc(clamp(38px,12vw,60px)*var(--fs,1))}
.card .p{font-size:calc(20px*var(--fs,1))}.card .m{font-size:calc(20px*var(--fs,1))}.card .e{font-size:calc(15px*var(--fs,1))}.card .ico{font-size:calc(84px*var(--fs,1))}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
#wv{position:fixed;inset:0;z-index:8;background:var(--bg);display:none;overflow:auto;padding-top:env(safe-area-inset-top,0px)}
#wv.on{display:block}
.wvh{position:sticky;top:0;z-index:2;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--ln)}
.wvh .r{display:flex;gap:8px;align-items:center;max-width:720px;margin:0 auto 8px}
.wvh h2{margin:0;flex:1;font-size:20px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wb{max-width:720px;margin:0 auto;padding:12px 16px 80px}
.wr{display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:10px 12px;margin-bottom:8px;transition:box-shadow .3s,border-color .3s}
.wr.s{border-color:#ffc83d;box-shadow:0 0 0 1px #ffc83d inset,0 0 22px rgba(255,200,61,.45);animation:gl 2.4s ease-in-out infinite}
@keyframes gl{50%{box-shadow:0 0 0 1px #ffc83d inset,0 0 32px rgba(255,200,61,.85)}}
.wi{font-size:28px;width:40px;text-align:center;flex:none}
.wt{flex:1;min-width:0}.wt b{font:900 20px 'Noto Sans SC','Be Vietnam Pro',sans-serif}.wt small{display:block;color:var(--mut)}.wt .ls{font-size:11px;color:var(--mut);opacity:.8}
.sb{width:44px;height:44px;border-radius:50%;font-size:24px;color:var(--mut);flex:none;transition:transform .25s,color .25s}
.wr.s .sb{color:#ffb400;transform:scale(1.2) rotate(72deg)}
.say.star.on{background:#ffc83d;color:#fff;box-shadow:0 0 18px #ffc83d}
html{-webkit-text-size-adjust:100%}
:root{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
*{scrollbar-width:thin;scrollbar-color:var(--ln) transparent}
body{min-height:100dvh;font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
button,.list{touch-action:manipulation}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}
#study,#study *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select,textarea{font-size:16px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.top button:focus-visible,.acts button:focus-visible{outline-color:#fff}
.card{cursor:grab;-webkit-touch-callout:none}.card.drag{cursor:grabbing}
#study,#wv{overscroll-behavior:none;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#wv{padding-bottom:env(safe-area-inset-bottom,0px)}
.top{align-self:center;width:100%;max-width:640px}
.stage{flex:0 1 780px;margin:auto 16px 6px}
.card .w,.bd,.ico.ph,.wt b{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei','Be Vietnam Pro',sans-serif}
#study::after{content:"← Đã thuộc   → Ôn lại   Space: hiện nghĩa   S: đánh sao   A: tự động   Z: quay lại";display:none;color:rgba(255,255,255,.75);font-size:12px;text-align:center;padding:0 16px 14px;margin-bottom:auto}
@media (hover:hover) and (pointer:fine){
 #study::after{display:block}
 .btn,.list{transition:transform .2s,border-color .2s}
 .btn:hover{border-color:var(--ac);transform:translateY(-1px)}
 .list:hover{border-color:var(--ac)}
 .acts button:hover{transform:scale(1.1)}
 .top button:hover{background:rgba(255,255,255,.3)}
 .sb:hover{color:#ffb400}.say:hover{filter:brightness(1.12)}
}
@media (min-width:768px){
 .wrap{max-width:960px;padding-top:36px}
 h1{font-size:44px}
 .fold{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
 .fold .fh,.fold .hint{grid-column:1/-1}.fold .list{margin:0}
 .modal{align-items:center}.sheet{border-radius:24px;max-width:540px}
 .stage{max-width:580px}
 .card{padding:34px 30px}
 .card .w{font-size:calc(76px*var(--fs,1))}.card .p,.card .m{font-size:calc(26px*var(--fs,1))}.card .e{font-size:calc(19px*var(--fs,1))}.card .ico{font-size:calc(110px*var(--fs,1))}
 .wvh .r,.wb{max-width:960px}
 .wb{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wb .wr{margin:0}.wb .empty{grid-column:1/-1}
 .acts button{width:64px;height:64px}
}
@media (max-height:520px) and (orientation:landscape){
 .card{padding:12px 18px}
 .card .ico{font-size:40px;margin-bottom:0}.card .w{font-size:clamp(26px,9vh,44px)}.card .p,.card .m{font-size:16px}.card .m{padding:4px 12px}.card .e{margin-top:6px;font-size:13px}
 .acts{padding:6px 0 8px}.acts button{width:44px;height:44px;font-size:18px}.top{padding:6px 14px}
}
@property --bh{syntax:'<number>';inherits:true;initial-value:250}
#study{background:linear-gradient(160deg,hsl(var(--bh) 70% 45%),hsl(calc(var(--bh) + 60) 70% 30%));transition:--bh .9s ease}
.orb{background:hsl(var(--bh) 95% 72%/.35)}
#study.on,#wv.on{animation:so .45s cubic-bezier(.2,.9,.3,1)}
@keyframes so{from{opacity:0;transform:scale(1.05)}}
.btn:active{transform:scale(.96)}
.pg i{box-shadow:0 0 12px #fff}
.card::after{content:"";position:absolute;inset:-20%;pointer-events:none;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%);transform:translateX(calc(var(--px,0)*1.2px));opacity:calc(var(--a,0)*.9)}
.card .ico{translate:calc(var(--px,0)*.14px) calc(var(--py,0)*.05px)}
.card .w{translate:calc(var(--px,0)*.08px) 0}
.card .p,.card .e,.card .m{translate:calc(var(--px,0)*.04px) 0}
.card .ico,.card .w,.card .p,.card .e{transition:translate .45s cubic-bezier(.2,.9,.3,1)}
.card .m{transition:filter .3s,translate .45s cubic-bezier(.2,.9,.3,1)}
.card.drag .ico,.card.drag .w,.card.drag .p,.card.drag .e,.card.drag .m{transition:none}
.card.in{animation:cin .5s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes cin{from{opacity:0;transform:translateY(50px) scale(.8)}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#262040;color:#fff;padding:10px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.3s;z-index:40;font-size:14px;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.wt .ls{display:block}.sb.ed{font-size:18px;width:38px}
#study{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.card .w.hz{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:6px 0}
.hzb{width:min(calc(var(--hs)*var(--fs,1)*1px),calc((100vw - 96px)/var(--n)));aspect-ratio:1;border-radius:12px;border:1.5px dashed hsl(var(--h) 70% 65%/.55);background:hsl(var(--h) 90% 60%/.07);display:grid;place-items:center;font:900 40px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.hzb svg{width:100%;height:100%;display:block}
.hzo{fill:hsl(var(--h) 40% 50%/.18)}
.hzs{fill:none;stroke:var(--fg);stroke-width:190;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.hzg{stroke:hsl(var(--h) 60% 60%/.4);stroke-width:6;stroke-dasharray:24 18;fill:none}
.card:has(.hz) .ico{font-size:calc(52px*var(--fs,1))}
.acts button.on{background:#ffc83d;box-shadow:0 0 20px #ffc83d}
#phBtn{font-size:17px;font-weight:700;letter-spacing:-.5px}
#phBtn.off{color:#9a96c4;text-decoration:line-through;text-decoration-thickness:2px}
#study.hp .card .p{visibility:hidden}
@media (max-width:420px){.acts{gap:8px}.acts button{width:46px;height:46px}}
@media (prefers-reduced-motion:reduce){.card.in{animation:none}.card::after{display:none}#study.on,#wv.on{animation:none}}
@media (prefers-reduced-motion:reduce){.card.shk,.card.bnc{animation:none}.rip{display:none}.wr.s{animation:none}.orb{animation:none}.ico{animation:none}.card{transition-duration:.01s}}
.gp{display:none;position:absolute;top:70px;bottom:24px;width:250px;padding:16px;border-radius:24px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:#fff;overflow:auto;z-index:5;box-shadow:0 10px 40px rgba(0,0,0,.18)}
.gp h3{margin:0 0 10px;font-size:16px}.gp h4{margin:14px 0 6px;font-size:12px;letter-spacing:.4px;text-transform:uppercase;opacity:.8;display:flex;align-items:center;gap:8px}
.gp small,.gh{font-size:12px;opacity:.8}
.ring{position:relative;width:96px;height:96px;margin:6px auto 10px}.ring svg{transform:rotate(-90deg);width:100%;height:100%}.ring circle{fill:none;stroke-width:3.2}.ring .rb{stroke:rgba(255,255,255,.22)}.ring .rf{stroke:#fff;stroke-linecap:round;transition:stroke-dasharray .4s}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px}
.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;text-align:center}.st3 b{display:block;font-size:20px}.st3 span{font-size:11px;opacity:.75}
.rc{display:flex;align-items:center;gap:6px;padding:7px 10px;margin-bottom:6px;border-radius:12px;background:rgba(255,255,255,.12);border-left:4px solid;cursor:pointer}.rc.ok{border-color:#3ee0a0}.rc.no{border-color:#ff8a6b}.rc span{flex:1;min-width:0}.rc b{display:block;font:900 16px 'Noto Sans SC','Be Vietnam Pro',sans-serif}.rc small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rc button{color:#ffd45a;font-size:18px}
.lv{display:flex;gap:4px}.lv i{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.22)}.lv i.on{background:#fff;box-shadow:0 0 8px #fff}
.exs{font-size:15px;line-height:1.5;margin-bottom:6px}
.mini{padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.2);font-size:12px;font-weight:600;color:#fff;text-transform:none;letter-spacing:0}
.ch{display:inline-block;margin:0 4px 4px 0;padding:4px 10px;border-radius:10px;background:rgba(255,255,255,.14);font-size:13px}.ch b{font-family:'Noto Sans SC','Be Vietnam Pro',sans-serif}
#gn{min-height:90px;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff;font-size:14px}#gn::placeholder{color:rgba(255,255,255,.6)}
#study textarea{-webkit-user-select:text;user-select:text}
.cx{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:calc(13px*var(--fs,1));color:var(--mut)}.cx button{padding:6px 14px;border-radius:999px;background:hsl(var(--h) 90% 60%/.18);font-weight:600;font-size:calc(14px*var(--fs,1))}
#gpL .ring{width:112px;height:112px}
#gpL .ring::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,214,120,0),rgba(255,214,120,.55),rgba(255,111,181,.45),rgba(255,214,120,0) 60%);filter:blur(10px);animation:rspin 5s linear infinite;z-index:0}
@keyframes rspin{to{transform:rotate(360deg)}}
.ring svg{position:relative;z-index:1}
.ring circle{stroke-width:3}.ring .rb{stroke:rgba(255,255,255,.16)}
.ring .rt{stroke:rgba(255,255,255,.35);stroke-width:1.3;stroke-dasharray:.45 1.22;stroke-linecap:butt}

.stage .card.top{align-self:auto}

    radial-gradient(circle at calc(50% + var(--px,0)*1.4px) calc(35% + var(--py,0)*1.4px),rgba(255,255,255,.38),transparent 38%),
    linear-gradient(105deg,transparent 40%,rgba(255,255,255,.42) 50%,transparent 60%),
    linear-gradient(115deg,transparent 22%,hsla(0,100%,72%,.16) 32%,hsla(50,100%,65%,.16) 40%,hsla(150,100%,60%,.16) 48%,hsla(205,100%,66%,.16) 56%,hsla(285,100%,72%,.16) 64%,transparent 74%);
  transform:translate(calc(var(--px,0)*1.2px),calc(var(--py,0)*.5px));
  opacity:calc(.18 + var(--a,0)*.82)}

.dgfr{background:radial-gradient(circle at var(--gx,50%) var(--gy,18%),rgba(255,255,255,.22),transparent 46%),linear-gradient(160deg,hsl(var(--h) 50% 18%/.97),hsl(calc(var(--h) + 50) 55% 8%/.98));outline:1.5px solid hsl(var(--h) 90% 78%/.5);outline-offset:-12px}

@media (prefers-reduced-motion:reduce){#dg::after,#dgst::before,.dgbk::after,.dgo.fl .dgi,.dgo.fl .dgfr,.dgo.fl .dgfr .dgw,.dgbeam,.dgwave{animation:none!important}.dgo.fl .dgi{transform:rotateY(180deg)}.dgbeam,.dgwave{display:none}}

<script>
var S={folders:[],lists:[]},$=function(i){return document.getElementById(i)};
function load(){try{var d=localStorage.getItem('vocab-v1');if(d)S=JSON.parse(d)}catch(e){}}
function save(nopush){try{localStorage.setItem('vocab-v1',JSON.stringify(S))}catch(e){}if(!nopush)schedSync()}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hlEx(d){
  var t=String(d.e==null?'':d.e),w=String(d.w==null?'':d.w);
  if(!t||!w)return esc(t);
  var zh=/[\u3400-\u9fff]/.test(w),base=w.replace(/⭐/g,'').replace(/\s*\([^)]*\)\s*/g,' ').trim(),c=[],seen={};
  function add(x){x=(x||'').trim();if(x&&!seen[x]){seen[x]=1;c.push(x)}}
  base.split(/\s*[\/,;、]\s*/).forEach(function(p){
    add(p.replace(/[（）]/g,''));
    add(p.replace(/（[^）]*）/g,''));
    add(p.replace(/[（）]/g,'').replace(/儿$/,''));
    p.split(/[…~～·]+/).forEach(function(q){add(q.replace(/[（）]/g,''));add(q.replace(/（[^）]*）/g,''))});
  });
  c.sort(function(a,b){return b.length-a.length});
  var R=[];
  function find(x,flags){
    var re=new RegExp(x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),flags),m,out=[];
    while((m=re.exec(t))){out.push([m.index,m.index+m[0].length]);if(!m[0].length)re.lastIndex++}
    return out;
  }
  for(var k=0;k<c.length&&!R.length;k++)R=find(c[k],zh?'g':'gi');
  if(!R.length&&zh){
    var chars={};Array.from(base.replace(/[（）]/g,'')).forEach(function(ch){if(/[\u3400-\u9fff]/.test(ch))chars[ch]=1});
    Object.keys(chars).forEach(function(ch){R=R.concat(find(ch,'g'))});
  }
  if(!R.length)return esc(t);
  R.sort(function(a,b){return a[0]-b[0]||b[1]-a[1]});
  var M=[];R.forEach(function(r){var l=M[M.length-1];if(l&&r[0]<=l[1])l[1]=Math.max(l[1],r[1]);else M.push([r[0],r[1]])});
  var o='',p=0;M.forEach(function(r){o+=esc(t.slice(p,r[0]))+'<mark class="hl">'+esc(t.slice(r[0],r[1]))+'</mark>';p=r[1]});
  return o+esc(t.slice(p));
}

/* ---------- library ---------- */
function listRow(l){var ic=(l.words.filter(function(w){return w.i})[0]||{}).i||((l.words[0]||{w:'+'}).w).charAt(0);return '<div class="list"><div class="bd" style="--h:'+hue(l.name)+'">'+esc(ic)+'</div><div class="t"><b>'+esc(l.name)+'</b><span>'+l.words.length+' từ · '+(l.lang==='zh'?'Tiếng Trung':'Tiếng Anh')+'</span></div><button class="btn sm pri" onclick="study(\'list\',\''+l.id+'\')">Ôn</button><button class="btn sm" onclick="openWords(\''+l.id+'\')">Xem</button><button class="x" onclick="del(this,\'list\',\''+l.id+'\')">Xóa</button></div>'}
function render(){
  var ns=0;S.lists.forEach(function(l){l.words.forEach(function(w){if(w.s)ns++})});
  if($('starBtn')){$('starBtn').textContent='⭐ Ôn từ khó ('+ns+')';$('starBtn').style.opacity=ns?1:.5}
  if($('dueBtn')){var nd=dueCount('all');$('dueBtn').textContent='📅 Ôn hôm nay ('+nd+')';$('dueBtn').style.opacity=nd?1:.5}
  var h='';
  S.folders.forEach(function(f){
    var ls=S.lists.filter(function(l){return l.folder===f.id});
    h+='<div class="fold"><div class="fh"><b>📁 '+esc(f.name)+'</b>'+(ls.length?'<button class="btn sm" onclick="study(\'folder\',\''+f.id+'\')">Ôn cả thư mục</button>':'')+'<button class="x" onclick="del(this,\'folder\',\''+f.id+'\')">Xóa</button></div>'+(ls.map(listRow).join('')||'<div class="hint">Thư mục trống. Khi tạo danh sách, chọn thư mục này.</div>')+'</div>';
  });
  var lo=S.lists.filter(function(l){return !l.folder||!S.folders.some(function(f){return f.id===l.folder})});
  if(lo.length)h+='<div class="fold">'+(S.folders.length?'<div class="fh"><b>Chưa phân loại</b></div>':'')+lo.map(listRow).join('')+'</div>';
  if(!S.lists.length&&!S.folders.length)h='<div class="empty">Chưa có từ nào.<br>Bấm “+ Danh sách từ” để dán từ vựng, hoặc nạp dữ liệu mẫu để thử.</div>';
  $('lib').innerHTML=h;
}
function del(b,type,id){
  if(!b.dataset.s){b.dataset.s=1;b.textContent='Chắc chắn?';setTimeout(function(){if(b.isConnected){b.textContent='Xóa';delete b.dataset.s}},2500);return}
  S.dels=S.dels||{};S.dels[id]=Date.now();if(type==='list')S.lists=S.lists.filter(function(l){return l.id!==id});
  else{S.folders=S.folders.filter(function(f){return f.id!==id});S.lists.forEach(function(l){if(l.folder===id){l.folder='';l.u=Date.now()}})}
  save();render();
}
function closeM(){$('mdl').classList.remove('on')}
function newFolder(){
  $('sheet').innerHTML='<h2>Thư mục mới</h2><label>Tên thư mục</label><input id="fn" placeholder="VD: HSK 3, IELTS"><div class="row" style="margin-top:16px"><button class="btn" onclick="closeM()">Hủy</button><button class="btn pri" onclick="addFolder()">Tạo thư mục</button></div>';
  $('mdl').classList.add('on');setTimeout(function(){$('fn').focus()},50);
}
function addFolder(){var n=$('fn').value.trim();if(!n)return;S.folders.push({id:uid(),name:n,u:Date.now()});save();closeM();render()}
function openList(){
  var o='<option value="">Không thuộc thư mục</option>'+S.folders.map(function(f){return '<option value="'+f.id+'">'+esc(f.name)+'</option>'}).join('');

"zhànlìpǐn","Chiến lợi phẩm","这是我赢来的战利品。 (Đây là chiến lợi phẩm tôi giành được.)","🏆"],["免得","miǎnde","Tránh việc, kẻo","早点出发，免得迟到。 (Đi sớm một chút, kẻo muộn.)","🛑"],["说闲话","shuō xiánhuà","Nói chuyện phiếm, nói ra nói vào","别在背后说人闲话。 (Đừng có nói chuyện phiếm/nói xấu sau lưng người khác.)","🗣️"],["农场","nóngchǎng","Nông trường","他们周末去农场摘草莓. (Cuối tuần họ đến nông trường hái dâu tây.)","🚜"],["豆芽菜","dòuyácài","Rau mầm, giá đỗ","她长得像个豆芽菜。 (Cô ấy gầy nhom trông như cọng giá đỗ vậy.)","🌱"],["偷","tōu","Trộm, ăn cắp","他偷了一个苹果。 (Cậu ấy ăn cắp một quả táo.)","🥷"],["拉黑","lāhēi","Chặn (trên mạng xã hội)","他把我拉黑了。 (Anh ấy chặn tôi rồi.)","🚫"],["有屁快放","yǒu pì kuài fàng","Có gì nói mau","有屁快放，我很忙。 (Có gì nói mau đi, tôi đang bận lắm.)","💨"],["呗","bei","Nha, thế thôi, thì...","你不去，我就自己去呗。 (Cậu không đi thì tôi tự đi vậy thôi.)","呢"],["理","lǐ","Để ý, quan tâm, đoái hoài","他生气了，谁理你. (Cậu ấy giận rồi, ai thèm để ý đến cậu.)","💭"],["亏心","kuīxīn","Thẹn lòng, cắn rứt lương tâm","做事要对得起良心，别太亏心。 (Làm việc phải có lương tâm, đừng để thẹn lòng.)","🖤"],["亏心事","kuīxīnshì","Việc làm trái lương tâm, việc xấu","他从来不做亏心事。 (Anh ấy chưa từng làm việc gì trái lương tâm.)","🥀"],["整","zhěng","Xử lý, chơi khăm, làm","这件事怎么整？ (Việc này giải quyết thế nào đây?)","🔧"],["停","tíng","Dừng, ngừng","雨停了。 (Mưa tẻ rồi / Mưa ngừng rồi.)","⏹️"],["嘴硬","zuǐyìng","Cứng miệng, già mồm","你就别嘴硬了。 (Cậu đừng có mà cứng miệng nữa.)","🧱"],["淋雨","línyǔ","Dầm mưa, tắm mưa","别在外面淋雨。 (Đừng có dầm mưa ngoài kia.)","🌧️"],["勉为其难","miǎnwéiqínán","Miễn cưỡng, ráng sức làm việc khó","既然你这么说，我就勉为其难地试一试。 (Đã vậy thì tôi miễn cưỡng thử một lần xem sao.)","🤷"],["到底","dàodǐ","Rốt cuộc, đến cùng, rốt cục","你到底想什么？ (Rốt cuộc cậu đang nghĩ gì vậy?)","🎯"],["学人说话","xué rén shuōhuà","Học theo/bắt chước người ta nói chuyện","别学人说话，真幼稚。 (Đừng có bắt chước người ta nói chuyện, trẻ con lắm.)","🦜"],["秘密","mìmì","Bí mật","这是我们的秘密。 (Đây là bí mật của chúng ta.)","🤫"],["撞见","zhuàngjiàn","Tình cờ gặp, bắt gặp","我在街上撞见他了。 (Tôi vô tình bắt gặp anh ấy trên var HZ=null,hzP=null,hzUid=0,hzTok=0;
function hzLoad(){
  if(hzP)return hzP;
  hzP=(async function(){
    try{
      var b=atob(document.getElementById('hzdata').textContent.trim()),u=new Uint8Array(b.length);
      for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
      HZ=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).json();
    }catch(e){HZ=null}
    return HZ;
  })();
  return hzP;
}
function hzChar(ch){
  var d=HZ&&HZ[ch];if(!d)return '<div class="hzb"><span>'+esc(ch)+'</span></div>';
  var id='hz'+(hzUid++),o='',s='';
  d[0].forEach(function(p,i){
    o+='<path class="hzo" d="'+p+'"/>';
    var m=d[1][i]||[];
    s+='<clipPath id="'+id+'_'+i+'"><path d="'+p+'"/></clipPath><path class="hzs" clip-path="url(#'+id+'_'+i+')" pathLength="1" stroke-dasharray="1 3" stroke-dashoffset="1.25" d="M'+m.map(function(q){return q[0]+' '+q[1]}).join('L')+'"/>';
  });
  return '<div class="hzb"><svg viewBox="0 0 1024 1024"><path class="hzg" d="M0 0H1024V1024H0Z M512 0V1024 M0 512H1024"/><g transform="translate(0,900) scale(1,-1)">'+o+s+'</g></svg></div>';
}
function wordHTML(d){
  if(cfg.stroke&&HZ&&d.l==='zh'&&/[\u3400-\u9fff]/.test(d.w)){
    var cs=Array.from(d.w).filter(function(c){return /[\u3400-\u9fff]/.test(c)}),n=cs.length,hs=n<=2?130:n<=4?92:n<=6?66:50;
    return '<div class="w hz" style="--n:'+n+';--hs:'+hs+'" aria-label="'+esc(d.w)+'">'+cs.map(function(c){return hzChar(c)}).join('')+'</div>';
  }
  return '<div class="w'+(d.w.length>7?' xs':d.w.length>4?' sm':'')+'">'+esc(d.w)+'</div>';
}
async function playStrokes(card){
  if(!card)return;
  var ps=[].slice.call(card.querySelectorAll('.hzs'));if(!ps.length)return;
  var tok=++hzTok;
  ps.forEach(function(p){if(p.getAnimations)p.getAnimations().forEach(function(a){a.cancel()});p.style.opacity=0});
  await sleep(350);
  var n=ps.length,per=auto?Math.max(110,Math.min(450,cfg.sec*800/n)):450;
  for(var i=0;i<n;i++){
    if(tok!==hzTok||!card.isConnected)return;
    var p=ps[i];p.style.opacity=1;
    p.animate([{strokeDashoffset:1.25},{strokeDashoffset:0}],{duration:per,fill:'forwards',easing:'ease-in-out'});
    await sleep(per+80);
  }
  await sleep(1800);
  if(tok===hzTok&&card.isConnected)playStrokes(card);
}

  for(var i=0;i<90;i++)P.push({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:5+Math.random()*7,r:Math.random()*6,c:'hsl('+Math.floor(Math.random()*360)+',90%,60%)'});
  (function f(){x.clearRect(0,0,c.width,c.height);t++;
    P.forEach(function(p){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(t<140)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})();
}

  /* (A) vận tốc theo từng khung: vị trí đầu bút MỚI (sáng lên) trừ vị trí CŨ (tối đi) => bắt được cả cú hất chỉ kéo dài 1 khung hình */

  /* ---------- Chế độ AI: nhận diện bàn tay bằng MediaPipe Hand Landmarker ---------- */
  var LM=null,lmLoading=false,lmFail=false,mlH=[],handSince=0,absentSince=0,stillSince=0,revLock=false,mlLastDir=0,mlLastSpd=0,mlLastT=0,mlLastTs=0;
  var MPV='0.10.14',MPB='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@'+MPV,

    if(LM||lmLoading||lmFail)return;lmLoading=true;

    var ids=[0,5,9,13,17],cxp=0,cyp=0;

  }

  function tick(){
    if(!stream||!vid.videoWidth)return;
    if(cfg.ml!==false&&!lmFail){
      if(!LM){lmLoad();lbl.textContent='⏳ tải AI…';return}
      try{mlTick(Date.now())}catch(e){lmFail=true;toast('Lỗi AI bàn tay, chuyển về chế độ cũ')}
      return;
    }
    var now=Date.now(),fdt=lastFT?Math.min(0.25,Math.max(0.02,(now-lastFT)/1000)):0.04;lastFT=now;
    cx.drawImage(vid,0,0,W,H);
    var d=cx.getImageData(0,0,W,H).data,g=(hist.length>=4?hist.shift():POOL[hist.length]),sum=0,hs=HS;hs.fill(0);
    for(var i=0;i<N;i++){var v=(d[i*4]*3+d[i*4+1]*6+d[i*4+2])/10;g[i]=v;sum+=v;hs[v|0]++}
    var mean=sum/N;

    if(base===null)base=mean;
    if(mean<base*0.45){
      if(!covered){covered=true;coverT=now}
      else if(coverT&&now-coverT>600&&now>cool){coverT=0;cool=now+1400}

    if(hist.length<4)return;

    var bt=Math.max(80,pc-8);

    var s1=0,s3=0;for(var i2=0;i2<N;i2++){s1+=g[i2]-p1[i2];s3+=g[i2]-p3[i2]}s1/=N;s3/=N;

      if(penOK&&df>thr&&gk>=bt){nPos++;sxPos+=x;syPos+=y;col=1}                 /* đầu bút vừa tới */
      else if(penOK&&df<-thr&&p1[k]>=bt){nNeg++;sxNeg+=x;syNeg+=y;col=2}        /* chỗ bút vừa rời */
      if(col||Math.abs(df)>thr||Math.abs(gk-p3[k]-s3)>thr*1.15){

  window.gestOn=async function(silent){

        else if(n==='NotReadableError'||n==='AbortError')msg='Camera đang được app khác dùng (Zoom, Camera...). Hãy tắt app đó rồi thử lại.';
        else if(window.self!==window.top)msg='Trang đang mở trong khung nhúng nên bị chặn camera. Hãy mở file trực tiếp trong Chrome/Safari.';
        else msg='Quyền camera đang bị chặn: bấm biểu tượng ổ khóa cạnh thanh địa chỉ → Camera → Cho phép, rồi tải lại trang.';
        toast(msg+' ['+n+']')}
      var b=document.getElementById('gestBtn');if(b)b.classList.remove('on');return false}
    vid.srcObject=stream;try{await vid.play()}catch(e){}
    armed=false;quietSince=0;hist=[];trP=[];trA=[];vt=[];vtH=[];lastDir=0;lastSpd=0;lastFT=0;blockOpp=false;base=null;covered=false;cool=Date.now()+1500;

  var _start=window.start,_quit=window.quit;

/* ---------- nâng cấp: sóng xung kích, tia sáng, ánh phản chiếu ---------- */
var dgRip=[];
function dgRipple(x,y,h){if(dgRM())return;dgRip.push({x:x,y:y,r:8,v:5.5,l:1,h:h|0});dgRip.push({x:x,y:y,r:2,v:3.4,l:1,h:((h|0)+50)%360})}
function dgFx(o,h){
  var ow=$('dgow');if(!ow||!dgOn)return;
  ow.insertAdjacentHTML('afterbegin','<i class="dgbeam" style="--h:'+h+'"></i><i class="dgwave" style="--h:'+h+'"></i>');
  var b=o.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2;
  dgRipple(cx,cy,h);dgLater(function(){dgRipple(cx,cy,(h+40)%360)},220);
  if(navigator.vibrate)try{navigator.vibrate([12,40,22])}catch(e){}
}
$('dgow').addEventListener('pointermove',function(e){
  var o=e.target.closest&&e.target.closest('.dgo');if(!o)return;var r=o.getBoundingClientRect();
  o.style.setProperty('--gx',((e.clientX-r.left)/r.width*100).toFixed(1)+'%');
  o.style.setProperty('--gy',((e.clientY-r.top)/r.height*100).toFixed(1)+'%');
});
</script>
</body>
</html>
